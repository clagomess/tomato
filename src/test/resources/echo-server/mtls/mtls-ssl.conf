Listen 4443

<VirtualHost _default_:4443>
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/mtls/server.crt
    SSLCertificateKeyFile /etc/apache2/mtls/server.key

    # require a client certificate issued by the Tomato Test CA
    SSLCACertificateFile /etc/apache2/mtls/ca.crt
    SSLVerifyClient require
    SSLVerifyDepth 2

    # expose SSL_CLIENT_* to PHP ($_SERVER in echo.php)
    SSLOptions +StdEnvVars +ExportCertData

    <Directory /var/www/html>
        AllowOverride All
    </Directory>
</VirtualHost>
